<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JustDetox</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: 'Inter', system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      p { font-size: 1.2rem; font-weight: 500; text-align: center; padding: 0 24px; }
    </style>
  </head>
  <body>
    <p role="alert">not right now, lock back in</p>
    <script src="blocked.js"></script>
  </body>
</html>
